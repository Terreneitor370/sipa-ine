name: API CI

on:
  pull_request:
    paths:
      - apps/api/**
      - db/**
      - docker-compose.yml
      - .github/workflows/api-ci.yml
  push:
    branches:
      - develop
      - main
    paths:
      - apps/api/**
      - db/**
      - docker-compose.yml
      - .github/workflows/api-ci.yml

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

  db-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sipa_ine
          MYSQL_USER: sipa
          MYSQL_PASSWORD: cambiar
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -usipa -pcambiar --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: apps/api
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: sipa_ine
      MYSQL_USER: sipa
      MYSQL_PASSWORD: cambiar
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run migrations and seeds
        run: npm run db:setup

      - name: Verify seed catalogs
        run: >-
          node --input-type=module -e "import mysql from 'mysql2/promise';
          const conn = await mysql.createConnection({host: process.env.MYSQL_HOST, port: Number(process.env.MYSQL_PORT), user: process.env.MYSQL_USER, password: process.env.MYSQL_PASSWORD, database: process.env.MYSQL_DATABASE});
          const [rows] = await conn.query('SELECT COUNT(*) AS total FROM entidad');
          await conn.end();
          if (!rows[0] || rows[0].total < 1) { console.error('Se esperaban entidades en el seed'); process.exit(1); }
          console.log('Entidades seed:', rows[0].total);"
