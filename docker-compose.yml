services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sipa_ine}
      MYSQL_USER: ${MYSQL_CONTAINER_USER:-sipa}
      MYSQL_PASSWORD: ${MYSQL_CONTAINER_PASSWORD:-cambiar}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-dev-local-jwt-secret}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATA_DIR: ${DATA_DIR:-data/processed}
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sipa_ine}
      MYSQL_USER: ${MYSQL_CONTAINER_USER:-sipa}
      MYSQL_PASSWORD: ${MYSQL_CONTAINER_PASSWORD:-cambiar}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador Demo}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@sipa-ine.mx}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      ANALISTA_NAME: ${ANALISTA_NAME:-Analista Demo}
      ANALISTA_EMAIL: ${ANALISTA_EMAIL:-analista@sipa-ine.mx}
      ANALISTA_PASSWORD: ${ANALISTA_PASSWORD:?Define ANALISTA_PASSWORD en .env}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./data/processed:/workspace/data/processed:ro
    command: sh -c "npm run db:setup && npm start"

volumes:
  mysql_data:
